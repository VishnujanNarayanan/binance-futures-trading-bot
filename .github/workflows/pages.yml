name: Publish API docs

# GitHub Pages cannot run FastAPI -- it serves static files only. So the OpenAPI
# schema is generated at build time and rendered by a standalone Swagger UI. The
# result is documentation that loads instantly and never sleeps, while "Try it out"
# still calls the live service on Render.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; always finish the most recent one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-api.txt
      - name: Build
        run: python scripts/build_docs.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
