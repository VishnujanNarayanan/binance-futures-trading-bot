name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check trading_bot tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt
      - name: Run tests
        # No API key is available in CI, and none is needed: the suite stubs the
        # Binance client. This run is also the regression test for that -- if a
        # module ever resolves credentials at import time again, it fails here.
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t trading-bot:ci .
      - name: Smoke test the image
        # Proves the entrypoint resolves and the bot.* imports work inside the
        # image. Needs no credentials, because the client is built lazily.
        run: docker run --rm trading-bot:ci --help
